name: Build AeroDock
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Test hover and focus behavior
        run: ./scripts/test.sh
      - name: Build application
        run: ./scripts/build-app.sh
      - uses: actions/upload-artifact@v4
        with:
          name: AeroDock-macOS-preview
          path: dist/AeroDock-macOS.zip
